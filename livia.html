<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="livia.css">
    <title>Livia Meu Amor</title>
</head>
<body>
    <div class="titulo">
        <h1 id="titulo">Você me ama?</h1>
    </div>
    <div class="opcoes">
        <button id="sim">Sim</button>
        <button id="nao">Não</button>
    </div>
    <script>
        const botao = document.getElementById('sim');
        const botaoN = document.getElementById('nao');
        botao.addEventListener('click', function() {
            titulo.textContent = 'EU TE AMO MAIS LIVINHA';
            titulo.style.color = 'rgb(3, 3, 117)';
        });
        botaoN.addEventListener('click', function() {
            titulo.textContent = 'Mesmo assim eu ainda te amo';
            titulo.style.color = 'purple'
        });
    </script>
</body>
</html>
